name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o IndriveGacorAssistant_V4_Peta_Grafik.zip -d .
              - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("IndriveGacorAssistant/app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {"""
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p IndriveGacorAssistant assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: indrive-gacor-assistant-apk
          path: IndriveGacorAssistant/app/build/outputs/apk/debug/app-debug.apk
